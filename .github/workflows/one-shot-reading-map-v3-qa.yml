name: One-shot Reading Map v3 QA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-reading-map-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden Reading Map launch QA
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path('scripts/audit_launch.py')
          s = audit.read_text(encoding='utf-8')
          s = s.replace('    legacy = base.text("assets/article-sidebar-interactive.js")\n', '    legacy = base.text("assets/article-sidebar-interactive.js")\n    state_guard = base.text("assets/article-reading-map-guard.css")\n', 1)
          s = s.replace('        "reading-map-v2",\n', '        "reading-map-v3",\n        "function liveNav()",\n        "nav !== lastNav",\n        "observer.observe(host",\n        "window.addEventListener(\'pageshow\'",\n', 1)
          anchor = '    for marker in legacy_markers:\n        if marker not in legacy:\n            base.error(f"Legacy Reading Map layer no longer defers correctly: {marker}")\n'
          addition = anchor + '\n    for marker in (\'aria-current="location"\', \'.work-toc nav a.active\'):\n        if marker not in state_guard:\n            base.error(f"Reading Map visual state guard missing resilience marker: {marker}")\n'
          if 'Reading Map visual state guard missing resilience marker' not in s:
              if anchor not in s:
                  raise SystemExit('Reading Map legacy audit anchor not found')
              s = s.replace(anchor, addition, 1)
          audit.write_text(s, encoding='utf-8')

          workflow = Path('.github/workflows/publication-health.yml')
          w = workflow.read_text(encoding='utf-8')
          old = '          node --check assets/reader-auth-v2.js\n          node --check assets/analytics-config.js\n'
          new = '          node --check assets/reader-auth-v2.js\n          node --check assets/analytics-config.js\n          node --check assets/article-runtime-integrity.js\n          node --check assets/article-sidebar-interactive.js\n'
          if 'node --check assets/article-runtime-integrity.js' not in w:
              if old not in w:
                  raise SystemExit('Publication health parse-check anchor not found')
              w = w.replace(old, new, 1)
          workflow.write_text(w, encoding='utf-8')
          PY
      - name: Validate migrated files
        run: |
          node --check assets/article-runtime-integrity.js
          python -m py_compile scripts/audit_launch.py
      - name: Commit QA update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit_launch.py .github/workflows/publication-health.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Guard self-healing Reading Map v3 in launch QA'
          git push
