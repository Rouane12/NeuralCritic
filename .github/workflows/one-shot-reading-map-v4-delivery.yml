name: One-shot Reading Map v4 delivery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deliver-reading-map-v4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Reading Map runtime first and cache-bust v4
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('article.html')
          s = p.read_text(encoding='utf-8')
          old_runtime = '<script src="assets/article-runtime-integrity.js?v=20260825-integrity3"></script>'
          new_runtime = '<script src="assets/article-runtime-integrity.js?v=20260825-integrity4"></script>'
          cdn = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          s = s.replace(old_runtime, '', 1)
          if new_runtime not in s:
              if cdn not in s:
                  raise SystemExit('Supabase CDN script anchor not found')
              s = s.replace(cdn, cdn + new_runtime, 1)
          s = s.replace('assets/article-sidebar-interactive.js?v=20260824-runtime2', 'assets/article-sidebar-interactive.js?v=20260825-map4', 1)
          s = s.replace('assets/article-reading-map-guard.css?v=20260825-map3', 'assets/article-reading-map-guard.css?v=20260825-map4', 1)
          p.write_text(s, encoding='utf-8')

          config = Path('assets/supabase-config.js')
          c = config.read_text(encoding='utf-8')
          c = c.replace('assets/story-router.js?v=20260824-story7', 'assets/story-router.js?v=20260825-story8', 1)
          config.write_text(c, encoding='utf-8')
          PY
      - name: Validate single-owner runtime
        run: |
          node --check assets/article-runtime-integrity.js
          node --check assets/article-sidebar-interactive.js
          node --check assets/story-router.js
          python - <<'PY'
          from pathlib import Path
          article = Path('article.html').read_text(encoding='utf-8')
          runtime = article.index('assets/article-runtime-integrity.js?v=20260825-integrity4')
          bootstrap = article.index('assets/supabase-config.js')
          assert runtime < bootstrap, 'Reading Map runtime must load before public bootstrap'
          assert 'installLegacyFallback' not in Path('assets/article-sidebar-interactive.js').read_text(encoding='utf-8')
          router = Path('assets/story-router.js').read_text(encoding='utf-8')
          assert 'bindReadingMap' not in router
          assert '.work-toc a[href^="#"]' not in router
          PY
      - name: Refresh canonical story shells
        run: python scripts/build_story_pages.py
      - name: Commit v4 delivery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add article.html assets/supabase-config.js stories sitemap.xml feed.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Deliver single-owner Reading Map v4'
          git push
