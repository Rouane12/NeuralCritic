name: Publication health

on:
  push:
    branches: [main]
    paths:
      - 404.html
      - article.html
      - game.html
      - author.html
      - index.html
      - category.html
      - search.html
      - topic.html
      - about.html
      - privacy.html
      - standards.html
      - commercial.html
      - studio.html
      - subscribers.html
      - newsroom.html
      - robots.txt
      - sitemap.xml
      - feed.xml
      - stories/**
      - topics/**
      - games/**
      - reviews/**
      - authors/**
      - assets/**
      - data/**
      - images/editorial/**
      - scripts/audit_publication.py
      - scripts/audit_publication_v2.py
      - scripts/audit_launch.py
      - scripts/audit_domain_readiness.py
      - scripts/audit_reader_auth.py
      - scripts/audit_news_sources.py
      - scripts/audit_discovery_links.py
      - scripts/audit_popularity_v2.py
      - scripts/audit_games_database.py
      - scripts/audit_games_directory.py
      - scripts/audit_review_intelligence.py
      - scripts/audit_publication_reliability.py
      - scripts/publication_config.py
      - scripts/build_robots.py
      - scripts/enrich_story_metadata.py
      - scripts/build_sitemap.py
      - scripts/build_story_pages.py
      - scripts/build_topic_pages.py
      - scripts/build_game_pages.py
      - scripts/build_author_pages.py
      - supabase/migrations/**
      - .github/workflows/build-publication.yml
      - .github/workflows/publication-health.yml
  pull_request:
    paths:
      - 404.html
      - article.html
      - game.html
      - author.html
      - index.html
      - category.html
      - search.html
      - topic.html
      - about.html
      - privacy.html
      - standards.html
      - commercial.html
      - studio.html
      - subscribers.html
      - newsroom.html
      - robots.txt
      - sitemap.xml
      - feed.xml
      - stories/**
      - topics/**
      - games/**
      - reviews/**
      - authors/**
      - assets/**
      - data/**
      - images/editorial/**
      - scripts/audit_publication.py
      - scripts/audit_publication_v2.py
      - scripts/audit_launch.py
      - scripts/audit_domain_readiness.py
      - scripts/audit_reader_auth.py
      - scripts/audit_news_sources.py
      - scripts/audit_discovery_links.py
      - scripts/audit_popularity_v2.py
      - scripts/audit_games_database.py
      - scripts/audit_games_directory.py
      - scripts/audit_review_intelligence.py
      - scripts/audit_publication_reliability.py
      - scripts/publication_config.py
      - scripts/build_robots.py
      - scripts/enrich_story_metadata.py
      - scripts/build_sitemap.py
      - scripts/build_story_pages.py
      - scripts/build_topic_pages.py
      - scripts/build_game_pages.py
      - scripts/build_author_pages.py
      - supabase/migrations/**
      - .github/workflows/build-publication.yml
      - .github/workflows/publication-health.yml
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neural-critic-publication-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse-check public and Studio JavaScript
        run: |
          node --check assets/reader-auth-v2.js
          node --check assets/analytics-config.js
          node --check assets/article-runtime-integrity.js
          node --check assets/article-sidebar-interactive.js
          node --check assets/article-news.js
          node --check assets/article-discovery.js
          node --check assets/recirculation.js
          node --check assets/popularity-signals.js
          node --check assets/content-api.js
          node --check assets/game-page.js
          node --check assets/games-directory.js
          node --check assets/review-intelligence.js
          node --check assets/studio-media.js
          node --check assets/studio-news.js

      - name: Audit Neural Critic publication surface
        run: python scripts/audit_publication_v2.py

      - name: Run final production launch gate
        run: python scripts/audit_launch.py

      - name: Audit Reader Auth V2
        run: python scripts/audit_reader_auth.py

      - name: Audit newsroom source documents
        run: python scripts/audit_news_sources.py

      - name: Audit discovery engine
        run: python scripts/audit_discovery_links.py

      - name: Audit Trending and Most Read V2
        run: python scripts/audit_popularity_v2.py

      - name: Audit Games Database V1
        run: python scripts/audit_games_database.py

      - name: Audit Games Directory and Release Calendar
        run: python scripts/audit_games_directory.py

      - name: Audit Review Intelligence V1
        run: python scripts/audit_review_intelligence.py

      - name: Audit Publication Reliability V2
        run: python scripts/audit_publication_reliability.py

      - name: Verify production domain portability
        run: python scripts/audit_domain_readiness.py
