name: Publication health

on:
  push:
    branches: [main]
    paths:
      - 404.html
      - article.html
      - author.html
      - index.html
      - category.html
      - search.html
      - topic.html
      - about.html
      - privacy.html
      - standards.html
      - commercial.html
      - studio.html
      - subscribers.html
      - newsroom.html
      - robots.txt
      - sitemap.xml
      - feed.xml
      - stories/**
      - topics/**
      - authors/**
      - assets/**
      - data/**
      - images/editorial/**
      - scripts/audit_publication.py
      - scripts/audit_publication_v2.py
      - scripts/audit_launch.py
      - scripts/audit_domain_readiness.py
      - scripts/publication_config.py
      - scripts/enrich_story_metadata.py
      - scripts/build_sitemap.py
      - scripts/build_story_pages.py
      - scripts/build_topic_pages.py
      - scripts/build_author_pages.py
      - supabase/migrations/**
      - .github/workflows/publication-health.yml
  pull_request:
    paths:
      - 404.html
      - article.html
      - author.html
      - index.html
      - category.html
      - search.html
      - topic.html
      - about.html
      - privacy.html
      - standards.html
      - commercial.html
      - studio.html
      - subscribers.html
      - newsroom.html
      - robots.txt
      - sitemap.xml
      - feed.xml
      - stories/**
      - topics/**
      - authors/**
      - assets/**
      - data/**
      - images/editorial/**
      - scripts/audit_publication.py
      - scripts/audit_publication_v2.py
      - scripts/audit_launch.py
      - scripts/audit_domain_readiness.py
      - scripts/publication_config.py
      - scripts/enrich_story_metadata.py
      - scripts/build_sitemap.py
      - scripts/build_story_pages.py
      - scripts/build_topic_pages.py
      - scripts/build_author_pages.py
      - supabase/migrations/**
      - .github/workflows/publication-health.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Neural Critic publication surface
        run: python scripts/audit_publication_v2.py

      - name: Run final production launch gate
        run: python scripts/audit_launch.py

      - name: Verify production domain portability
        run: python scripts/audit_domain_readiness.py
