name: One-shot Reading Map v3 delivery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deliver-reading-map-v3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust Reading Map v3 and load state guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('article.html')
          s = p.read_text(encoding='utf-8')
          old_css = '<link rel="stylesheet" href="assets/article-sidebar-interactive.css?v=20260822-rail6"><link rel="stylesheet" href="assets/article-formatting.css?v=20260822-type4">'
          new_css = '<link rel="stylesheet" href="assets/article-sidebar-interactive.css?v=20260822-rail6"><link rel="stylesheet" href="assets/article-reading-map-guard.css?v=20260825-map3"><link rel="stylesheet" href="assets/article-formatting.css?v=20260822-type4">'
          if old_css not in s and 'article-reading-map-guard.css' not in s:
              raise SystemExit('Expected sidebar stylesheet sequence not found')
          if 'article-reading-map-guard.css' not in s:
              s = s.replace(old_css, new_css, 1)
          s = s.replace('assets/article-runtime-integrity.js?v=20260824-integrity2', 'assets/article-runtime-integrity.js?v=20260825-integrity3', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit delivery update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add article.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Deliver self-healing Reading Map v3'
          git push
