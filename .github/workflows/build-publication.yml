name: Refresh publication discovery files

on:
  push:
    branches: [main]
    paths:
      - article.html
      - topic.html
      - game.html
      - author.html
      - data/**
      - scripts/publication_config.py
      - scripts/build_runtime_fallback.py
      - scripts/build_robots.py
      - scripts/build_sitemap.py
      - scripts/build_story_pages.py
      - scripts/build_topic_pages.py
      - scripts/build_game_pages.py
      - scripts/build_author_pages.py
      - scripts/enrich_story_metadata.py
      - scripts/audit_publication_reliability.py
      - scripts/audit_runtime_consistency.py
      - assets/supabase-config.js
      - assets/article-news-layout-v3.css
      - assets/game-page.js
      - assets/game-page.css
      - supabase/migrations/**
      - .github/workflows/build-publication.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neural-critic-publication-discovery-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NEURAL_CRITIC_SITE_URL: https://www.neuralcritic.net/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize checkout with current main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin source document layout override in article shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("article.html")
          html = path.read_text(encoding="utf-8")
          marker = 'assets/article-news-layout-v3.css'
          if marker not in html:
              html, count = re.subn(r'(<link rel="stylesheet" href="assets/article-news\.css[^"]*">)', r'\1<link rel="stylesheet" href="assets/article-news-layout-v3.css">', html, count=1)
              if count != 1:
                  raise SystemExit("Could not locate article-news.css in article.html")
              path.write_text(html, encoding="utf-8")
          PY

      - name: Refresh runtime CMS fallback
        run: python scripts/build_runtime_fallback.py

      - name: Refresh robots from configured publication origin
        run: python scripts/build_robots.py

      - name: Refresh sitemap and RSS from published CMS stories
        run: python scripts/build_sitemap.py

      - name: Build canonical story shells and canonical discovery links
        run: python scripts/build_story_pages.py

      - name: Build canonical Game Graph topic hubs
        run: python scripts/build_topic_pages.py

      - name: Build canonical game database pages
        run: python scripts/build_game_pages.py

      - name: Build canonical writer profile hubs
        run: python scripts/build_author_pages.py

      - name: Link story structured data to canonical writer pages
        run: python scripts/enrich_story_metadata.py

      - name: Reliability gate generated publication state
        run: python scripts/audit_publication_reliability.py

      - name: Enforce browser runtime consistency invariant
        run: python scripts/audit_runtime_consistency.py

      - name: Commit publication files only when changed
        run: |
          if git diff --quiet -- article.html game.html robots.txt sitemap.xml feed.xml data/articles.json data/articles stories topics games authors; then
            echo "Publication runtime fallback, discovery files, story shells, topic hubs, game pages, writer hubs, article shell, and robots are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article.html game.html robots.txt sitemap.xml feed.xml data/articles.json data/articles stories topics games authors
          git commit -m "Refresh Neural Critic canonical publication pages"
          git pull --rebase origin main
          git push
