name: Refresh publication discovery files

on:
  push:
    branches: [main]
    paths:
      - article.html
      - topic.html
      - author.html
      - data/**
      - scripts/publication_config.py
      - scripts/build_robots.py
      - scripts/build_sitemap.py
      - scripts/build_story_pages.py
      - scripts/build_topic_pages.py
      - scripts/build_author_pages.py
      - scripts/enrich_story_metadata.py
      - assets/supabase-config.js
      - assets/article-news-layout-v3.css
      - .github/workflows/build-publication.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neural-critic-publication-discovery-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEURAL_CRITIC_SITE_URL: https://www.neuralcritic.net/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin source document layout override in article shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("article.html")
          html = path.read_text(encoding="utf-8")
          marker = 'assets/article-news-layout-v3.css'

          if marker not in html:
              html, count = re.subn(
                  r'(<link rel="stylesheet" href="assets/article-news\.css[^"]*">)',
                  r'\1<link rel="stylesheet" href="assets/article-news-layout-v3.css">',
                  html,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not locate article-news.css in article.html")
              path.write_text(html, encoding="utf-8")
          PY

      - name: Refresh robots from configured publication origin
        run: python scripts/build_robots.py

      - name: Refresh sitemap and RSS from published CMS stories
        run: python scripts/build_sitemap.py

      - name: Build canonical story shells and canonical discovery links
        run: python scripts/build_story_pages.py

      - name: Build canonical Game Graph topic hubs
        run: python scripts/build_topic_pages.py

      - name: Build canonical writer profile hubs
        run: python scripts/build_author_pages.py

      - name: Link story structured data to canonical writer pages
        run: python scripts/enrich_story_metadata.py

      - name: Commit publication files only when changed
        run: |
          if git diff --quiet -- article.html robots.txt sitemap.xml feed.xml stories topics authors; then
            echo "Publication discovery files, story shells, topic hubs, writer hubs, article shell, and robots are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article.html robots.txt sitemap.xml feed.xml stories topics authors
          git commit -m "Refresh Neural Critic canonical publication pages"
          git pull --rebase origin main
          git push
