name: Build publication routes

on:
  push:
    branches: [main]
    paths:
      - scripts/build_publication.py
      - article.html
      - assets/supabase-config.js
      - .github/workflows/build-publication.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neural-critic-publication-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate canonical article routes and sitemap
        env:
          NC_SITE_URL: https://rouane12.github.io/NeuralCritic/
        run: python scripts/build_publication.py

      - name: Commit generated publication files
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain reviews features guides news sitemap.xml robots.txt .generated-routes.json 2>/dev/null)" ]; then
            echo "Publication routes are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews features guides news sitemap.xml robots.txt .generated-routes.json
          git commit -m "Refresh Neural Critic publication routes"
          git pull --rebase origin main
          git push
