name: Fast publish canonical story

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Published Neural Critic article slug
        required: true
        type: string
  push:
    branches: [publication-trigger]
    paths:
      - data/fast-publish-trigger.json

permissions:
  contents: write

concurrency:
  group: neural-critic-publication-write
  cancel-in-progress: false

jobs:
  publish-story:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEURAL_CRITIC_SITE_URL: https://www.neuralcritic.net/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize checkout with current main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Resolve requested story slug
        env:
          DISPATCH_SLUG: ${{ inputs.slug }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          slug = os.environ.get("DISPATCH_SLUG", "").strip()
          if not slug:
              trigger = Path("data/fast-publish-trigger.json")
              if not trigger.exists():
                  raise SystemExit("Fast-publish trigger file is missing")
              payload = json.loads(trigger.read_text(encoding="utf-8"))
              slug = str(payload.get("slug") or "").strip()

          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]*", slug):
              raise SystemExit("Invalid story slug")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"STORY_SLUG={slug}\n")
          print(f"Resolved story slug: {slug}")
          PY

      - name: Synchronize requested story runtime fallback
        run: python scripts/fast_publish_runtime.py --slug "$STORY_SLUG"

      - name: Build requested canonical story shell
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import sys
          import urllib.parse
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          import build_story_pages as builder

          slug = os.environ.get("STORY_SLUG", "").strip()
          if not builder.valid_slug(slug):
              raise SystemExit("Invalid story slug")

          rows, source = builder.load_articles()
          article = next((row for row in rows if str(row.get("slug") or "").strip() == slug), None)
          if not article:
              raise SystemExit(f"Published article not found for slug: {slug}")

          # Fast publishing deliberately keeps the original absolute image URL when
          # one exists. The full publication refresh can localize/optimize it later;
          # social crawlers get a valid image immediately instead of waiting for the
          # heavier media pipeline.
          original_stable_image = builder.stable_image
          def fast_stable_image(value):
              raw = str(value or "").strip()
              if not raw:
                  return ""
              parsed = urllib.parse.urlparse(raw)
              if parsed.scheme in {"http", "https"}:
                  return raw
              return urllib.parse.urljoin(builder.SITE_URL, raw)
          builder.stable_image = fast_stable_image

          template = builder.ARTICLE_TEMPLATE.read_text(encoding="utf-8")
          output = builder.render_story(template, article)

          # Keep the requested shell tied to the exact app runtime in this checkout.
          app_hash = hashlib.sha256((root / "assets" / "app.js").read_bytes()).hexdigest()[:12]
          output, replacements = re.subn(
              r'assets/app\.js(?:\?v=[^"\']*)?',
              f'assets/app.js?v={app_hash}',
              output,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not pin the current app.js runtime in canonical story shell")

          directory = builder.STORIES_DIR / slug
          directory.mkdir(parents=True, exist_ok=True)
          target = directory / "index.html"
          target.write_text(output, encoding="utf-8")
          builder.stable_image = original_stable_image
          print(f"Fast-built {target} from {source} metadata with app runtime {app_hash}")
          PY

      - name: Harden requested canonical story runtime
        run: python scripts/harden_story_shells.py --slug "$STORY_SLUG"

      - name: Commit atomic story runtime and canonical shell
        run: |
          targets=("data/articles.json" "data/articles/${STORY_SLUG}.json" "stories/${STORY_SLUG}/index.html")
          if git diff --quiet -- "${targets[@]}" && [ -z "$(git status --porcelain -- "${targets[@]}")" ]; then
            echo "Fast-publish runtime and canonical story shell are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${targets[@]}"
          git commit -m "Fast publish canonical story: ${STORY_SLUG}"
          git pull --rebase origin main
          git push

      - name: Verify live story is distribution-ready
        run: python scripts/check_live_story.py --slug "$STORY_SLUG" --timeout 360 --interval 8
