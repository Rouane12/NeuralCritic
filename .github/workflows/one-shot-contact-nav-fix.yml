name: One-shot contact nav fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-contact-nav:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make footer Contact a normal page link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/app.js')
          s=p.read_text(encoding='utf-8')
          old='href="mailto:contact@neuralcritic.net?subject=Neural%20Critic%20inquiry">Contact</a>'
          new='href="about.html#contact">Contact</a>'
          if old not in s:
              raise SystemExit('Expected footer contact link not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.js
          git commit -m 'Make footer Contact open the site contact section'
          git push
