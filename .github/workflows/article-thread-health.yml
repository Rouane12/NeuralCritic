name: Article Thread health

on:
  pull_request:
    paths:
      - article.html
      - assets/article-news-layout-v5.css
      - assets/article-thread-spacing-v2.css
      - assets/article-thread-experience-v2.css
      - assets/community-stable.css
      - assets/community-stable.js
      - assets/community-thread-recovery.js
      - assets/community-actions-v2.js
      - scripts/test_article_thread_phase2.js
      - .github/workflows/article-thread-health.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neural-critic-article-thread-${{ github.ref }}
  cancel-in-progress: true

jobs:
  thread:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse-check Thread regression script
        run: node --check scripts/test_article_thread_phase2.js

      - name: Verify Article Thread Phase 2 contracts
        run: node scripts/test_article_thread_phase2.js
